<!doctype html>
<html lang="it">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UPDATE — ACADEMY</title></head>
<body style="margin:0;background:#030b1a;color:#e8f4ff;font-family:Arial,sans-serif"><div id="loading" style="min-height:100vh;display:grid;place-items:center">Caricamento Academy…</div>
<script>
(async()=>{
  const BASE='https://raw.githubusercontent.com/leosorge/academy/d1e751beddc55b39027b7c4cee6c8f44bc2ccaf8/index.html';
  const VINCOS='https://vincos.it/wp-content/uploads/2026/02/vincos-logo.png';
  try{
    let html=await (await fetch(BASE,{cache:'no-store'})).text();
    // Midjourney by Vincos: cambia solo lo sponsor; logo Vincos già presente nel file base.
    html=html.replace('id:5, nome:"Midjourney by Vincos", sponsor:"Visionary Lab"','id:5, nome:"Midjourney by Vincos", sponsor:"Vincos"');

    // Public Speaking CVD non viene modificato: resta identico al file base.
    const palestra=`  {
    id:16, nome:"Palestra IA", sponsor:"Vincos",
    premio:"Allenamento IA", data_mod:"16/08/26",
    logo:"${VINCOS}",
    domande:[
      {t:"Cos'è Palestra IA?",o:["A) Un corso universitario di informatica","B) Una piattaforma italiana per allenarsi al prompt design con esercizi pratici quotidiani","C) Un'app per generare immagini AI","D) Un servizio di assistenza clienti automatizzato"],c:"B",s:"Palestra IA è una piattaforma italiana per allenarsi al prompt design con esercizi pratici quotidiani."},
      {t:"Di cosa è il \\"naturale complemento\\" la piattaforma?",o:["A) Del podcast \\"AI Italia\\"","B) Del libro \\"Esercizi di Intelligenza Aumentata\\"","C) Di un corso su Udemy","D) Di una newsletter su LinkedIn"],c:"B",s:"È il naturale complemento del libro Esercizi di Intelligenza Aumentata."},
      {t:"Quali strumenti vengono citati per gli esercizi su video AI?",o:["A) Runway e Kling","B) Photoshop e Illustrator","C) Premiere e DaVinci Resolve","D) Notion e Airtable"],c:"A",s:"Gli strumenti citati sono Runway e Kling."},
      {t:"Quali strumenti vengono citati per l'automazione di workflow e agenti AI?",o:["A) Salesforce e HubSpot","B) n8n e Zapier","C) Slack e Trello","D) Notion e Asana"],c:"B",s:"Gli strumenti citati sono n8n e Zapier."},
      {t:"Chi è l'ideatore di Palestra IA?",o:["A) Sam Altman","B) Marco Montemagno","C) Vincenzo Cosenza","D) Luciano Floridi"],c:"C",s:"L'ideatore di Palestra IA è Vincenzo Cosenza."}
    ]
  },\n`;
    const marker='  {\n    id:16, nome:"Coming Soon"';
    if(!html.includes(marker)) throw new Error('Marker Coming Soon non trovato');
    html=html.replace(marker,palestra+'  {\n    id:17, nome:"Coming Soon"');
    document.open(); document.write(html); document.close();
  }catch(e){
    document.getElementById('loading').innerHTML='<div style="padding:24px;text-align:center">Errore nel caricamento di Academy.<br><small>'+e.message+'</small></div>';
  }
})();
</script></body></html>
